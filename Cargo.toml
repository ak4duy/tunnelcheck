[package]
name = "tunnelcheck"
version = "0.1.0"
edition = "2024"
description = "A small command-line uptime monitor configured with one TOML file"
license = "MIT"
repository = "https://github.com/ak4duy/tunnelcheck"
readme = "README.md"
keywords = ["uptime", "monitoring", "healthcheck", "cli"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1"
clap = { version = "4.6.7", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
dirs = "5"
serde_json = "1.0.154"
x509-parser = "0.18.1"
libc = "0.2"
